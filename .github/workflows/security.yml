# Same check rolldown runs: oxc's security action audits workflow permissions,
# unpinned third-party actions, and injection-prone `${{ }}` in run blocks.
name: Security Analysis

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master]
    paths: [".github/workflows/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

jobs:
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: oxc-project/security-action@12d013ba60a82c2a7d0ef35bbe38249dc7f7cf1a # v1.0.9
