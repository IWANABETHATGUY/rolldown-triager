# `dist/index.js` is what GitHub executes (action.yml `main:`), but it is not
# kept on master — it is a build artifact, and reviewing it in every diff is
# noise. This builds it at release time and moves the tag onto the commit that
# contains it, so `uses: owner/repo@v0.9.0` still resolves to a runnable tree.
#
# Push a tag to release:  git tag v0.9.0 && git push origin v0.9.0
name: Release

permissions: {}

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The push below authenticates explicitly, so the token does not need
          # to sit in .git/config for the whole job.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache here on purpose: this job publishes the artifact the
      # action executes, and a restorable cache is a path into that artifact.
      # Omitting `cache` is not enough — `package-manager-cache` defaults to
      # true and our `packageManager` field turns caching on by itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Commit the bundle and move the tag onto it
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/index.js
          git commit -m "build: bundle for $TAG"
          git tag -f "$TAG"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$TAG"
